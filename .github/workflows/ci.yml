name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.name.outputs.image }}
      sha_tag: ${{ steps.name.outputs.sha_tag }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # GHCR rejects uppercase path segments, and the owner here is "Moosa-13".
      - name: Compute image name
        id: name
        run: |
          image="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The test stage runs ctest inside the build. A failure here fails the
      # job, so an image that cannot pass its suite is never pushed.
      - name: Build and run tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AVISION_COMMIT=${{ github.sha }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push runtime image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            AVISION_COMMIT=${{ github.sha }}

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo
            echo "- image: \`${{ steps.name.outputs.image }}\`"
            echo "- immutable tag: \`${{ steps.name.outputs.sha_tag }}\`"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # "Deploy" here moves the `production` pointer to the build that just passed.
  # When you wire up a real host, this is the job that grows a pull/restart step.
  deploy:
    needs: build-test-publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retags the existing manifest by digest -- no rebuild, so what goes live
      # is byte-identical to what passed the tests.
      - name: Point `production` at this build
        run: |
          set -euo pipefail
          image='${{ needs.build-test-publish.outputs.image }}'
          digest='${{ needs.build-test-publish.outputs.digest }}'
          docker buildx imagetools create --tag "${image}:production" "${image}@${digest}"

      - name: Verify what is live
        run: |
          set -euo pipefail
          image='${{ needs.build-test-publish.outputs.image }}'
          docker run --rm --entrypoint /usr/local/bin/VisionEngine \
            "${image}:production" --version

      - name: Record the release
        run: |
          {
            echo "### Deployed"
            echo
            echo "- \`${{ needs.build-test-publish.outputs.image }}:production\`"
            echo "- now points at \`${{ needs.build-test-publish.outputs.sha_tag }}\`"
            echo "- digest \`${{ needs.build-test-publish.outputs.digest }}\`"
            echo
            echo "To roll back, run the **Rollback** workflow with a previous \`sha-\` tag."
          } >> "$GITHUB_STEP_SUMMARY"
